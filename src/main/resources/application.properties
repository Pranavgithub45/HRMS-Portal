spring.application.name=HRMS-Portal
server.port=9999

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/hrms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.secret=CHANGE_ME_min_32_bytes_for_HS256_xxxxxxxxxxxxx
app.jwt.expiration-ms=86400000

# --- File storage (Phase 6) ---
app.file.upload-dir=./uploads
app.file.max-size-bytes=5242880
app.file.allowed-formats=PDF,JPG,JPEG,PNG
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Documents (Phase 8 dashboard) ---
app.documents.required=AADHAR

# --- Errors ---
server.error.include-message=always
server.error.include-binding-errors=always